spring.application.name=shopkart-backend-test
server.port=8080

# Isolated In-Memory H2 for Test Suite
spring.datasource.url=jdbc:h2:mem:shopkarttestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway during unit/integration slice tests to use Hibernate auto-ddl
spring.flyway.enabled=false

# In-memory simple cache for tests (no Redis required during test run)
spring.cache.type=simple

# Security & JWT
jwt.secret=9a3f2c4e6b8a1d0f5e7c2b4a6d8f0e1c3b5a7d9e1f3a5c7b9d1e3f5a7b9c1d3e
jwt.expirationMs=86400000

# File Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Razorpay sandbox test keys
razorpay.key.id=rzp_test_shopkartTestKey123
razorpay.key.secret=test_secret_shopkartSandbox2026
razorpay.webhook.secret=whsec_test_secret123

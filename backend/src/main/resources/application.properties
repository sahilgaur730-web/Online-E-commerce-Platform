spring.application.name=shopkart-backend
server.port=8080
spring.data.web.pageable.page-serialization-mode=via-dto

# Database Configuration (Defaults to embedded H2 for local dev; overridable via env vars for Docker/PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:shopkartdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

# Robust HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=ShopKartHikariPool

# Flyway Database Migration (enabled in Docker/Postgres environments via env var)
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Caching Layer (simple for local dev, redis in docker/production)
spring.cache.type=${SPRING_CACHE_TYPE:simple}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.cache.redis.time-to-live=600000ms
spring.cache.redis.cache-null-values=false

# Security & JWT (HMAC-SHA256 256-bit key)
jwt.secret=9a3f2c4e6b8a1d0f5e7c2b4a6d8f0e1c3b5a7d9e1f3a5c7b9d1e3f5a7b9c1d3e
jwt.expirationMs=86400000

# File Upload limits & Object Storage
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
upload.dir=${UPLOAD_DIR:uploads}
storage.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
storage.cloudinary.api-key=${CLOUDINARY_API_KEY:}
storage.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
storage.s3.bucket=${AWS_S3_BUCKET:}
storage.s3.region=${AWS_S3_REGION:ap-south-1}
storage.s3.access-key=${AWS_ACCESS_KEY_ID:}
storage.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}

# Razorpay Payment Gateway Sandbox
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_shopkartSandbox101}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:secret_shopkartSandboxKey2026}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:whsec_shopkartSandboxSecret}

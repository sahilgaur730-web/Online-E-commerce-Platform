# ==============================================================================
# ShopKart Common Application Configuration
# Shared baseline across all active Spring profiles
# ==============================================================================

spring:
  application:
    name: shopkart-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    web:
      pageable:
        page-serialization-mode: via-dto
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

# File Upload & Local/Cloud Object Storage Configuration
upload:
  dir: ${UPLOAD_DIR:uploads}

storage:
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  s3:
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_S3_REGION:ap-south-1}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

# Security & JWT Configuration (Strictly bound to environment variable)
jwt:
  secret: ${JWT_SECRET}
  expirationMs: ${JWT_EXPIRATION_MS:86400000}

# Payment Gateway Configuration (Bound to environment variables without hardcoded keys)
payment:
  sandbox-key: ${PAYMENT_SANDBOX_KEY:}

razorpay:
  key:
    id: ${PAYMENT_SANDBOX_KEY:${RAZORPAY_KEY_ID:}}
    secret: ${PAYMENT_SANDBOX_SECRET:${RAZORPAY_KEY_SECRET:}}
  webhook:
    secret: ${RAZORPAY_WEBHOOK_SECRET:}

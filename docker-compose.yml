version: '3.8'

services:
  # PostgreSQL Persistent Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: shopkart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopkart
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopkart"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis In-Memory Distributed Caching Layer
  redis:
    image: redis:7-alpine
    container_name: shopkart-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ShopKart Spring Boot Modular Monolith Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopkart-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopkart
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_CACHE_TYPE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_shopkartSandbox101}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-secret_shopkartSandboxKey2026}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-whsec_shopkartSandboxSecret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ShopKart React 19 + Vite + Tailwind CSS Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shopkart-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
